services:
    laravel:
        container_name: UzDuokBackend-laravel
        hostname: local.test
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - UzDuokBackend-backend
        depends_on:
            - mysql
    mysql:
        container_name: UzDuokBackend-mysql
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'UzDuokBackend-mysql:/var/lib/mysql'
        networks:
            - UzDuokBackend-backend
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    phpmyadmin:
        container_name: UzDuokBackend-phpmyadmin
        image: 'phpmyadmin:latest'
        ports:
            - "8080:80"
        networks:
            - UzDuokBackend-backend
        environment:
            - PMA_HOST=mysql
            - PMA_VERBOSE=${DB_USERNAME}
    queue:
        container_name: UzDuokBackend-queue
        build:
            context: ./docker/local
            dockerfile: Dockerfile
        volumes:
            - '.:/var/www/html'
        networks:
            - UzDuokBackend-backend
        depends_on:
            mysql:
                condition: service_started
        environment:
            DB_HOST: mysql
networks:
    UzDuokBackend-backend:
        name: UzDuokBackend-network
        external: true
volumes:
    UzDuokBackend-mysql:
        driver: local
